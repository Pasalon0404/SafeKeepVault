# Complete a release's OpenTimestamps proof.
#
# release.yml attaches a *pending* boot.html.ots (calendar receipts). Once a
# Bitcoin block includes the calendars' commitment (usually a few hours),
# `ots upgrade` turns it into a complete proof that `ots verify` can check
# against a Bitcoin node. This runs every six hours on the latest release and
# does nothing once its proof is complete. Run it by hand with a tag to
# upgrade an older release, or to create a missing proof.

name: Upgrade OpenTimestamps proof

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: the latest release)'
        required: false

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # replace the release's boot.html.ots asset
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the OpenTimestamps client
        run: python -m pip install --require-hashes -r .github/ots-requirements.txt

      - name: Upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          fi
          if [ -z "$tag" ]; then echo "No release yet."; exit 0; fi
          echo "Release: $tag"
          mkdir -p work && cd work
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern boot.html --pattern SHA256SUMS
          sha256sum -c SHA256SUMS
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern boot.html.ots 2>/dev/null; then
            if ots info boot.html.ots | grep -q BitcoinBlockHeaderAttestation; then
              echo "Proof already complete."; exit 0
            fi
            if ots upgrade boot.html.ots; then
              echo "Proof upgraded."
            else
              echo "Still pending; will retry on the next run."; exit 0
            fi
          else
            echo "No proof attached; creating one."
            ots stamp boot.html
          fi
          ots info boot.html.ots
          gh release upload "$tag" boot.html.ots --repo "$GITHUB_REPOSITORY" --clobber
