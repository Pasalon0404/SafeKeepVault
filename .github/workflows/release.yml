# Release: build boot.html from a version tag and publish it with everything
# needed to verify it (see VERIFYING.md).
#
#   git tag v1.36 && git push origin v1.36     (VERSION must say 1.36)
#
# Publishes a GitHub Release with:
#   boot.html        the app, built by this workflow from the tagged commit
#   SHA256SUMS       its SHA-256
#   boot.html.ots    OpenTimestamps proof of that digest (pending until a
#                    Bitcoin block confirms it; ots-upgrade.yml completes it)
# plus a GitHub artifact attestation (Sigstore) binding the bytes to this
# repository and workflow run. The maintainer then adds SHA256SUMS.asc, a GPG
# signature made offline with the key in developer-pubkey.asc.
#
# Third-party actions are pinned to full commit SHAs; the comment gives the tag.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # Sigstore OIDC token for the attestation
      attestations: write   # store the attestation
    defaults:
      run:
        working-directory: seed-xor-tool
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The build number in the stamp is the commit count, so a shallow
          # clone would stamp (and hash) differently from everyone else's build.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: seed-xor-tool/.nvmrc

      - name: Tag must match VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(cat VERSION)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::Tag $TAG does not match seed-xor-tool/VERSION ($want)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: |
          for f in test-*.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          npm run build
          cp dist/boot.html "$RUNNER_TEMP/boot-first.html"

      - name: Rebuild and require identical bytes
        run: |
          rm -rf dist
          npm run build
          cmp "$RUNNER_TEMP/boot-first.html" dist/boot.html
          echo "Two builds produced identical bytes."

      - name: Check the version stamp
        run: |
          if grep -q '+ local changes' dist/boot.html; then
            echo "::error::boot.html is stamped '+ local changes'."
            exit 1
          fi
          grep -o "v$(cat VERSION) · build [0-9]* · $(git rev-parse --short=7 HEAD) · [0-9-]*" dist/boot.html

      - name: Checksums
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp dist/boot.html "$GITHUB_WORKSPACE/release/boot.html"
          cd "$GITHUB_WORKSPACE/release"
          sha256sum boot.html > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/boot.html

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: OpenTimestamps proof
        # A calendar outage must not block the release; ots-upgrade.yml can
        # add the proof later (run it with this tag).
        continue-on-error: true
        run: |
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/ots-requirements.txt"
          ots stamp "$GITHUB_WORKSPACE/release/boot.html"
          ots info "$GITHUB_WORKSPACE/release/boot.html.ots"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "$GITHUB_WORKSPACE/release"
          sha=$(cut -d' ' -f1 SHA256SUMS)
          stamp=$(grep -o "v[0-9.]* · build [0-9]* · [0-9a-f]* · [0-9-]*" boot.html | head -1)
          {
            echo "**Build:** \`$stamp\`"
            echo
            echo "**SHA-256 (boot.html):** \`$sha\`"
            echo
            echo "Verify before use — see [VERIFYING.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/VERIFYING.md):"
            echo
            echo '```sh'
            echo 'sha256sum -c SHA256SUMS'
            echo "gh attestation verify boot.html -R $GITHUB_REPOSITORY"
            echo 'gpg --verify SHA256SUMS.asc SHA256SUMS   # once the maintainer has signed'
            echo '```'
            if [ ! -f boot.html.ots ]; then
              echo
              echo "_The OpenTimestamps proof was not created; it will be added by the OTS upgrade workflow._"
            fi
          } > notes.md
          files=(boot.html SHA256SUMS)
          if [ -f boot.html.ots ]; then files+=(boot.html.ots); fi
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SafeKeepVault $TAG" --notes-file notes.md
