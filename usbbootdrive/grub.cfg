# SafeKeep GRUB config: two OS slots (see UPDATER_DESIGN.md).
# The OS partition holds casper-a/ and casper-b/, and slot.cfg
# ("set slot=a" or "set slot=b") names the one to boot. slot.cfg is only
# ever replaced by renaming a complete new file over it, so a power cut
# leaves either the old choice or the new one.
#
# build.sh installs this file three times: on the EFI partition (read by
# BIOS GRUB), inside EFI/BOOT/BOOTX64.EFI (UEFI GRUB carries its own copy),
# and on the OS partition.
insmod part_gpt
insmod ext2
insmod fat
insmod search_label
insmod linux
insmod gzio
insmod test
insmod configfile

set timeout=3
set default=0

# Search for the OS partition by label
search --no-floppy --label --set=ospart safekeep-os
if [ -z "$ospart" ]; then
    set ospart=hd0,gpt3
fi
set root=${ospart}

set slot=a
if [ -f /slot.cfg ]; then
    source /slot.cfg
fi
if [ "$slot" = "b" ]; then
    set other=a
else
    set slot=a
    set other=b
fi
# A slot without a kernel can't boot: fall back to the other one.
if [ ! -f /casper-${slot}/vmlinuz ]; then
    set t=${slot}
    set slot=${other}
    set other=${t}
fi

# noprompt — suppresses casper's "Please remove the installation medium,
# then press ENTER" prompt at shutdown. SafeKeep poweroffs are deliberate
# (dashboard Power Options modal calls sudo poweroff), so the "are you
# sure?" prompt is not useful — it just leaves a wall of kernel I/O
# warnings sitting on the screen during the casper eject sequence.
menuentry "SafeKeepVault" {
    set root=${ospart}
    linux /casper-${slot}/vmlinuz boot=casper live-media-path=casper-${slot} nopersistent noprompt quiet splash usbhid.quirks=0xd13e:0xcc10:0x4 ---
    initrd /casper-${slot}/initrd
}

menuentry "SafeKeepVault (Safe Mode)" {
    set root=${ospart}
    linux /casper-${slot}/vmlinuz boot=casper live-media-path=casper-${slot} nopersistent noprompt nomodeset usbhid.quirks=0xd13e:0xcc10:0x4 ---
    initrd /casper-${slot}/initrd
}

if [ -f /casper-${other}/vmlinuz ]; then
    menuentry "SafeKeepVault (previous version, slot ${other})" {
        set root=${ospart}
        linux /casper-${other}/vmlinuz boot=casper live-media-path=casper-${other} nopersistent noprompt quiet splash usbhid.quirks=0xd13e:0xcc10:0x4 ---
        initrd /casper-${other}/initrd
    }
fi
